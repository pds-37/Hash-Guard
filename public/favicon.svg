<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favShieldGrad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="favBgGrad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="favCoreGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base / Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#070b14" />
  <rect width="64" height="64" rx="14" stroke="#1e293b" stroke-width="1.5" />

  <!-- Shield Glow Underlay -->
  <path d="M32 9 L51 18.5 C51 38 32 53.5 32 53.5 C32 53.5 13 38 13 18.5 Z" 
        fill="#06b6d4" fill-opacity="0.25" filter="url(#favGlow)" />

  <!-- Shield Body -->
  <path d="M32 10 L50 19 C50 37.5 32 52 32 52 C32 52 14 37.5 14 19 Z" 
        fill="url(#favBgGrad)" 
        stroke="url(#favShieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Cyber Line -->
  <path d="M32 15 L45 21.5 C45 34.5 32 46 32 46 C32 46 19 34.5 19 21.5 Z" 
        stroke="#0ea5e9" 
        stroke-width="1" 
        stroke-opacity="0.4" 
        stroke-dasharray="3 2" 
        fill="none" />

  <!-- Central Cryptographic Lattice Hexagon -->
  <path d="M32 23 L23 29 L23 37 L32 43 L41 37 L41 29 Z" 
        stroke="#38bdf8" 
        stroke-width="1.8" 
        fill="#0369a1" 
        fill-opacity="0.4" />

  <!-- Hash / Block Nodes -->
  <circle cx="32" cy="23" r="2.5" fill="#22d3ee" filter="url(#favGlow)" />
  <circle cx="23" cy="29" r="2.2" fill="#38bdf8" />
  <circle cx="41" cy="29" r="2.2" fill="#38bdf8" />
  <circle cx="23" cy="37" r="2.2" fill="#818cf8" />
  <circle cx="41" cy="37" r="2.2" fill="#818cf8" />
  <circle cx="32" cy="43" r="2.5" fill="#a855f7" />

  <!-- Center Keyhole / Custody Core -->
  <circle cx="32" cy="32" r="3.2" fill="#22d3ee" />
  <path d="M30.5 33 L33.5 33 L34.5 38 L29.5 38 Z" fill="#22d3ee" />
</svg>