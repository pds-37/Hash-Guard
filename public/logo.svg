<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <!-- Background / Glow Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="shieldBorder" x1="16" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="chainGrad" x1="20" y1="20" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="72" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- SHIELD EMBLEM (Icon Mark) -->
  <g id="shield-emblem">
    <!-- Ambient Shield Glow -->
    <path d="M32 9 L51 18.5 C51 38 32 53.5 32 53.5 C32 53.5 13 38 13 18.5 Z" 
          fill="#06b6d4" fill-opacity="0.12" filter="url(#coreGlow)" />

    <!-- Outer Shield Body -->
    <path d="M32 10 L50 19 C50 37.5 32 52 32 52 C32 52 14 37.5 14 19 Z" 
          fill="url(#shieldFill)" 
          stroke="url(#shieldBorder)" 
          stroke-width="2.2" 
          stroke-linejoin="round" />

    <!-- Inner High-Tech Facet / Bevel Accent -->
    <path d="M32 14 L45 20.8 C45 34.5 32 46.5 32 46.5 C32 46.5 19 34.5 19 20.8 Z" 
          stroke="#0ea5e9" 
          stroke-width="1" 
          stroke-opacity="0.45" 
          stroke-dasharray="3 2" 
          fill="none" />

    <!-- Center Cryptographic Merkle / Hash Chain Lines -->
    <path d="M32 24 L24 30 L24 36 L32 41 L40 36 L40 30 Z" 
          stroke="#38bdf8" 
          stroke-width="1.4" 
          fill="#0369a1" 
          fill-opacity="0.35" />

    <!-- Cryptographic Block Nodes -->
    <circle cx="32" cy="24" r="2.2" fill="#22d3ee" filter="url(#logoGlow)" />
    <circle cx="24" cy="30" r="1.8" fill="#38bdf8" />
    <circle cx="40" cy="30" r="1.8" fill="#38bdf8" />
    <circle cx="24" cy="36" r="1.8" fill="#818cf8" />
    <circle cx="40" cy="36" r="1.8" fill="#818cf8" />
    <circle cx="32" cy="41" r="2.2" fill="#a855f7" />

    <!-- Connecting Bus Lines -->
    <line x1="32" y1="26" x2="32" y2="33" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="26" y1="31" x2="38" y2="31" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- Forensic Chain of Custody Link Intersect -->
    <path d="M29 32.5 C29 30.5 35 30.5 35 32.5 V35.5 C35 37.5 29 37.5 29 35.5 Z" 
          stroke="#38bdf8" 
          stroke-width="1.2" 
          fill="none" />

    <!-- Digital Fingerprint / Hash Arc Accents -->
    <path d="M28 20 C30 18.5 34 18.5 36 20" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M26 44 C29 46.5 35 46.5 38 44" stroke="#0ea5e9" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g id="brand-text" transform="translate(64, 0)">
    <!-- Primary Brand Title -->
    <text x="0" y="27" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="0.18em" 
          fill="url(#textGrad)">
      HASH<tspan fill="#22d3ee">GUARD</tspan>
    </text>

    <!-- Subtitle / Platform Name -->
    <text x="0.5" y="42" 
          font-family="'JetBrains Mono', Consolas, monospace" 
          font-size="7.5" 
          font-weight="600" 
          letter-spacing="0.28em" 
          fill="#06b6d4" 
          opacity="0.95">
      CYBER EVIDENCE EXCHANGE
    </text>

    <!-- Security & Provenance Badge / Pill -->
    <text x="0.5" y="52" 
          font-family="'JetBrains Mono', Consolas, monospace" 
          font-size="5.5" 
          font-weight="500" 
          letter-spacing="0.22em" 
          fill="#64748b">
      ON-CHAIN PROVENANCE • ZERO-TRUST
    </text>
  </g>
</svg>
