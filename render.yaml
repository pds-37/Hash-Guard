services:
  - type: web
    name: cee-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cee-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: cee-db
    databaseName: cee
    user: postgres
    plan: free
